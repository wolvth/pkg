# ============================================================
# fake-flow 构建 workflow（合并版，只编译、不测试）
#
# 一次运行产出：核心包 fakeflow + LuCI 包 luci-app-fakeflow
#
# 手动 Run workflow 时选择：
#   - 架构 arch：x86 / arm（默认 arm，arm = rockchip/armv8）
#   - 版本 version：25.12.5（APK 格式）/ 24.10.5（IPK 格式），默认 25.12.5
#
# 源码：运行时 git clone https://github.com/lilu0826/fake-flow.git
#
# 速度机制（对齐原仓库 luci.yml 的"40 秒出包"）：
#   1. 包缓存（内容寻址）：源码树哈希 + 版本 + 架构没变
#      → 直接复用上次编好的包，不下载 SDK、不装依赖、不编译，整次运行 < 1 分钟
#   2. SDK 缓存：依赖（libbpf/elfutils/iproute2/luci-base ...）编译产物复用，
#      源码变了也只重编两个插件包（约 2-4 分钟）
#   3. 全新组合第一次（冷缓存）：约 15-20 分钟
# ============================================================
name: fake-flow packages (core + LuCI)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '目标架构（arm = rockchip/armv8）'
        type: choice
        options: [x86, arm]
        default: arm
      version:
        description: 'OpenWrt 版本（25.12.5 = APK 格式，24.10.5 = IPK 格式）'
        type: choice
        options: ['25.12.5', '24.10.5']
        default: '25.12.5'
      source_ref:
        description: 'fake-flow 源码 ref（分支/标签/提交 SHA），留空 = 默认分支'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      arch:
        description: 'x86 或 arm'
        type: string
        required: false
        default: 'arm'
      version:
        description: '25.12.5 或 24.10.5'
        type: string
        required: false
        default: '25.12.5'
      source_ref:
        description: 'fake-flow 源码 ref，留空 = 默认分支'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: fake-flow ${{ inputs.arch }} ${{ inputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_REPO: https://github.com/lilu0826/fake-flow.git
      SOURCE_REF: ${{ inputs.source_ref }}
      INPUT_ARCH: ${{ inputs.arch }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      # 根据手动选择解析目标：SDK 文件名 + 官方 sha256 + 包格式 + 架构标识
      - name: Resolve build target
        id: resolve
        run: |
          set -euo pipefail
          case "$INPUT_ARCH/$INPUT_VERSION" in
            x86/25.12.5)
              TARGET='x86/64'; PKGEXT='apk'; PKG_ARCH='x86_64'; ARCH_LABEL='x86_64'
              SDK_FILE='openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst'
              SDK_SHA256='0c8df0151a1e88feb7c03d694d61f6a18d51872815b7c811d76e2b77504d5e9c'
              INSTALL_DOC='packaging/openwrt/INSTALL-25.12.md'
              ;;
            arm/25.12.5)
              TARGET='rockchip/armv8'; PKGEXT='apk'; PKG_ARCH='aarch64_generic'; ARCH_LABEL='rockchip_armv8'
              SDK_FILE='openwrt-sdk-25.12.5-rockchip-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst'
              SDK_SHA256='59194a023968398af64bfa7d8bc3eac322641f6dc9cdbade28a4d9dd41866eba'
              INSTALL_DOC='packaging/openwrt/INSTALL-25.12.md'
              ;;
            x86/24.10.5)
              TARGET='x86/64'; PKGEXT='ipk'; PKG_ARCH='x86_64'; ARCH_LABEL='x86_64'
              SDK_FILE='openwrt-sdk-24.10.5-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst'
              SDK_SHA256='d3e8ea62fc1c12f93a9c808c2ef4c01b6e149ee240bcd5a74d15bebcbc385bdd'
              INSTALL_DOC='packaging/luci/INSTALL.md'
              ;;
            arm/24.10.5)
              TARGET='rockchip/armv8'; PKGEXT='ipk'; PKG_ARCH='aarch64_generic'; ARCH_LABEL='rockchip_armv8'
              SDK_FILE='openwrt-sdk-24.10.5-rockchip-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst'
              SDK_SHA256='5ba3db732cb1ad0dc723c9428360c18c03ae346b961ec7102aaf3466501834de'
              INSTALL_DOC='packaging/luci/INSTALL.md'
              ;;
            *)
              echo "::error::unsupported arch/version combination: $INPUT_ARCH / $INPUT_VERSION"
              exit 1
              ;;
          esac
          {
            echo "TARGET=$TARGET"
            echo "PKGEXT=$PKGEXT"
            echo "PKG_ARCH=$PKG_ARCH"
            echo "SDK_FILE=$SDK_FILE"
            echo "SDK_SHA256=$SDK_SHA256"
            echo "INSTALL_DOC=$INSTALL_DOC"
          } >> "$GITHUB_ENV"
          {
            echo "sdk_file=$SDK_FILE"
            echo "arch_label=$ARCH_LABEL"
            echo "pkgext=$PKGEXT"
          } >> "$GITHUB_OUTPUT"
          echo "Build target: $TARGET ($PKG_ARCH), package format: $PKGEXT"

      # 本仓库没有插件源码：clone 源码仓库到工作目录，
      # 后续相对路径（packaging/ Makefile ...）都指向这份 clone
      - name: Clone plugin source
        run: |
          set -euo pipefail
          test -z "$(ls -A "$GITHUB_WORKSPACE")" || { echo "::error::GITHUB_WORKSPACE is not empty"; exit 1; }
          git clone "$SOURCE_REPO" "$GITHUB_WORKSPACE"
          if [ -n "$SOURCE_REF" ]; then
            git -C "$GITHUB_WORKSPACE" checkout --detach "$SOURCE_REF"
          fi
          echo "Source commit: $(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          git -C "$GITHUB_WORKSPACE" log -1 --oneline

      # 源码树内容哈希：内容不变则编译产物不变，可整体复用
      - name: Compute source fingerprint
        id: fingerprint
        run: |
          set -euo pipefail
          HASH="$(git -C "$GITHUB_WORKSPACE" archive HEAD | sha256sum | cut -d' ' -f1)"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Source tree hash: $HASH"

      # 包缓存（内容寻址）：命中 = 上次编好的核心包 + LuCI 包
      - uses: actions/cache/restore@v4
        id: pkgs-cache
        with:
          path: cached-pkgs
          key: pkgs-${{ inputs.version }}-${{ inputs.arch }}-${{ steps.resolve.outputs.pkgext }}-${{ steps.fingerprint.outputs.hash }}

      - name: Decide build plan
        id: plan
        run: |
          set -euo pipefail
          n="$(find cached-pkgs -type f -name "*.$PKGEXT" 2>/dev/null | wc -l)"
          if [ "$n" -eq 2 ]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "BUILD_MODE=reuse" >> "$GITHUB_ENV"
            echo "Inputs unchanged: reusing cached packages, skipping SDK download and compile." | tee build.log
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "BUILD_MODE=rebuild" >> "$GITHUB_ENV"
            echo "No cached packages for these inputs: building core + LuCI." | tee build.log
          fi

      - name: Install prerequisites
        if: steps.plan.outputs.reuse == 'false'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang llvm flex bison gawk gettext libncurses-dev libssl-dev python3-setuptools rsync swig unzip zstd file

      # SDK + 依赖编译产物缓存。key 每次运行唯一（GitHub 缓存不可覆盖），
      # restore-keys 按前缀取最近一份（含旧版 key，兼容历史缓存）
      - uses: actions/cache/restore@v4
        if: steps.plan.outputs.reuse == 'false'
        id: sdk-cache
        with:
          path: ${{ runner.temp }}/sdk
          key: sdk-${{ steps.resolve.outputs.sdk_file }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sdk-${{ steps.resolve.outputs.sdk_file }}-
            openwrt-sdk-${{ inputs.version }}-${{ inputs.arch }}-
            openwrt-sdk-${{ inputs.version }}-${{ steps.resolve.outputs.arch_label }}-

      - name: Download verified SDK
        if: steps.plan.outputs.reuse == 'false'
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/sdk"
          if [ -f "$sdk/.sdk-complete" ] && [ "$(cat "$sdk/.sdk-complete")" = "$SDK_FILE" ]; then
            echo "SDK restored from cache, skip download."
            exit 0
          fi
          # 旧版缓存没有标记文件：用 .config 里的目标板卡验证身份后复用
          board="${TARGET%/*}"; subtarget="${TARGET#*/}"
          if [ ! -f "$sdk/.sdk-complete" ] && [ -f "$sdk/.config" ] &&
             grep -q "CONFIG_TARGET_BOARD=\"$board\"" "$sdk/.config" &&
             grep -q "CONFIG_TARGET_SUBTARGET=\"$subtarget\"" "$sdk/.config"; then
            echo "Legacy cached SDK verified for $TARGET, reusing."
            echo "$SDK_FILE" > "$sdk/.sdk-complete"
            exit 0
          fi
          rm -rf "$sdk"
          mkdir -p "$sdk"
          base="https://downloads.openwrt.org/releases/$INPUT_VERSION/targets/$TARGET"
          curl -fL --retry 3 "$base/$SDK_FILE" -o "$RUNNER_TEMP/sdk.tar.zst"
          echo "$SDK_SHA256  $RUNNER_TEMP/sdk.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/sdk.tar.zst" --strip-components=1 -C "$sdk"
          echo "$SDK_FILE" > "$sdk/.sdk-complete"

      # 一次 make 调用同时编核心包 + LuCI 包（luci 若依赖核心会自动排序）
      - name: Build core and LuCI packages
        if: steps.plan.outputs.reuse == 'false'
        working-directory: ${{ runner.temp }}/sdk
        run: |
          set -euo pipefail
          if [ ! -d feeds/base ]; then ./scripts/feeds update -a; fi
          ./scripts/feeds install libbpf elfutils zlib iproute2 luci-base rpcd libubox jsonfilter
          if [ -f package/fakeflow/Makefile ]; then make package/fakeflow/clean; fi
          if [ -f package/luci-app-fakeflow/Makefile ]; then make package/luci-app-fakeflow/clean; fi
          if [ -d bin/packages ]; then
            find bin/packages \( -name "fakeflow*.$PKGEXT" -o -name "luci-app-fakeflow*.$PKGEXT" \) -delete
          fi
          rm -rf package/fakeflow/src package/luci-app-fakeflow
          mkdir -p package/fakeflow/src package/luci-app-fakeflow
          git -C "$GITHUB_WORKSPACE" archive HEAD | tar -x -C package/fakeflow/src
          # SDK 会扫描嵌套 Makefile；这两个是打包配方，不是源码
          rm -f package/fakeflow/src/packaging/openwrt/Makefile package/fakeflow/src/packaging/luci/Makefile
          cp "$GITHUB_WORKSPACE/packaging/openwrt/Makefile" package/fakeflow/Makefile
          cp -a "$GITHUB_WORKSPACE/packaging/luci/." package/luci-app-fakeflow/
          {
            echo 'CONFIG_ALL_NONSHARED=n'
            echo 'CONFIG_ALL_KMODS=n'
            echo 'CONFIG_ALL=n'
            echo 'CONFIG_PACKAGE_fakeflow=m'
            echo 'CONFIG_PACKAGE_luci-app-fakeflow=m'
            echo 'CONFIG_SIGNED_PACKAGES=n'
            if [ "$PKGEXT" = apk ]; then echo 'CONFIG_USE_APK=y'; fi
          } > .config
          make defconfig
          if [ "$PKGEXT" = apk ]; then grep -q '^CONFIG_USE_APK=y' .config; fi
          make -j"$(nproc)" package/fakeflow/compile package/luci-app-fakeflow/compile V=s BPF_CLANG=clang 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          # 编好的包放入包缓存目录（供复用与收集）
          mkdir -p "$GITHUB_WORKSPACE/cached-pkgs"
          find bin/packages \( -name "fakeflow*.$PKGEXT" -o -name "luci-app-fakeflow*.$PKGEXT" \) -exec cp '{}' "$GITHUB_WORKSPACE/cached-pkgs/" \;
          test "$(find "$GITHUB_WORKSPACE/cached-pkgs" -name "*.$PKGEXT" | wc -l)" -eq 2

      # 包缓存（内容寻址，key 不变即结果不变，可安全存一次用多次）
      - uses: actions/cache/save@v4
        if: steps.plan.outputs.reuse == 'false'
        with:
          path: cached-pkgs
          key: pkgs-${{ inputs.version }}-${{ inputs.arch }}-${{ steps.resolve.outputs.pkgext }}-${{ steps.fingerprint.outputs.hash }}

      - uses: actions/cache/save@v4
        if: steps.plan.outputs.reuse == 'false'
        with:
          path: ${{ runner.temp }}/sdk
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

      - name: Collect packages
        run: |
          set -euo pipefail
          mkdir -p dist
          find cached-pkgs \( -name "fakeflow*.$PKGEXT" -o -name "luci-app-fakeflow*.$PKGEXT" \) -exec cp '{}' dist/ \;
          ls -l dist
          test "$(find dist -name "*.$PKGEXT" | wc -l)" -eq 2
          if [ "$PKGEXT" = ipk ]; then
            # ipk 文件名带架构：LuCI 包是 noarch(_all)，核心包带目标架构
            test "$(find dist -name "luci-app-fakeflow*_all.$PKGEXT" | wc -l)" -eq 1
            test "$(find dist -name "fakeflow_*_${PKG_ARCH}.$PKGEXT" | wc -l)" -eq 1
          fi
          cp "$GITHUB_WORKSPACE/$INSTALL_DOC" dist/INSTALL.md
          {
            echo "OpenWrt SDK: $INPUT_VERSION"
            echo "Target: $TARGET ($PKG_ARCH, musl)"
            echo "Package format: $PKGEXT"
            echo "Packages: fakeflow (core) + luci-app-fakeflow (LuCI)"
            echo "Source: $SOURCE_REPO @ $(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
            echo "Build mode: ${BUILD_MODE:-unknown}"
            echo "Built (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > dist/BUILD.txt
          (cd dist && sha256sum *."$PKGEXT" > SHA256SUMS)
          cat dist/BUILD.txt

      - uses: actions/upload-artifact@v4
        with:
          name: fakeflow-${{ inputs.arch }}-${{ inputs.version }}
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-${{ inputs.arch }}-${{ inputs.version }}
          path: build.log
          if-no-files-found: ignore
