# 通用 OpenWrt LuCI 单/多插件编译器
# 支持单/多包自动探测、多级子目录、自动编译 i18n 翻译包
name: Build test

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: '插件源码仓库地址 (HTTPS)'
        required: true
        default: 'https://github.com/wolvth/build.git'
      repo_branch:
        description: '仓库分支'
        required: false
        default: 'main'
      plugin_subdir:
        description: '插件子目录（留空=全仓库深度扫描，也支持指定如 qnatter）'
        required: false
        default: ''
      package_name:
        description: '手动指定包名（支持多个，空格或逗号分隔；留空则全自动检测）'
        required: false
        default: ''
      openwrt_version:
        description: 'OpenWrt SDK 版本'
        required: false
        default: '25.12.5'
      target_arch:
        description: '目标架构（格式: target subtarget）'
        required: false
        default: 'rockchip armv8'

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-24.04

    steps:
    # ── 1. 解析基础参数 ───────────────────────────────────────
    - name: 解析参数
      run: |
        ARCH="${{ inputs.target_arch }}"
        TARGET=$(echo "$ARCH" | awk '{print $1}')
        SUBTARGET=$(echo "$ARCH" | awk '{print $2}')
        REPO_NAME=$(basename -s .git "${{ inputs.repo_url }}")
        
        echo "VERSION=${{ inputs.openwrt_version }}" >> $GITHUB_ENV
        echo "TARGET=$TARGET"                       >> $GITHUB_ENV
        echo "SUBTARGET=$SUBTARGET"                 >> $GITHUB_ENV
        echo "REPO_NAME=$REPO_NAME"                 >> $GITHUB_ENV
        echo "PLUGIN_SUBDIR=${{ inputs.plugin_subdir }}" >> $GITHUB_ENV

    # ── 2. 安装依赖 ──────────────────────────────────────────
    - name: 安装基础编译依赖
      run: |
        sudo apt-get update -qq
        sudo apt-get install -yqq \
          build-essential libncurses-dev zlib1g-dev gawk git \
          gettext libssl-dev xsltproc rsync wget unzip file \
          python3 python3-pyelftools zstd dos2unix
        echo "✅ 编译依赖就绪"

    - name: 配置 Go 编译环境
      uses: actions/setup-go@v6
      with:
        go-version: 'stable'
        
    # ── 3. SDK 缓存 ──────────────────────────────────────────
    - name: 缓存 SDK
      id: cache-sdk
      uses: actions/cache@v6
      with:
        path: sdk.tar.zst
        key: openwrt-sdk-${{ env.VERSION }}-${{ env.TARGET }}-${{ env.SUBTARGET }}

    # ── 4. 下载 SDK ──────────────────────────────────────────
    - name: 下载 SDK
      if: steps.cache-sdk.outputs.cache-hit != 'true'
      run: |
        BASE="https://downloads.openwrt.org/releases/${VERSION}/targets/${TARGET}/${SUBTARGET}"
        echo "🔍 查询版本校验表: ${BASE}/sha256sums"
        
        SHALIST=$(wget -qO- "${BASE}/sha256sums" || true)
        if [ -z "$SHALIST" ]; then
          echo "❌ 无法访问该架构目录，请确认版本与架构拼写是否正确。"
          exit 1
        fi

        SDK_FILE=$(echo "$SHALIST" | grep -oE "openwrt-sdk-[^ ]+\.Linux-x86_64\.(tar\.zst|tar\.xz)" | head -n1)
        if [ -z "$SDK_FILE" ]; then
          echo "❌ 未在官方镜像中匹配到对应的 SDK 压缩包"
          exit 1
        fi

        echo "📦 开始下载 SDK: ${BASE}/${SDK_FILE}"
        wget -q --show-progress "${BASE}/${SDK_FILE}" -O sdk.tar.zst
        echo "✅ 下载完成: $(du -h sdk.tar.zst | cut -f1)"

    # ── 5. 解压 SDK ──────────────────────────────────────────
    - name: 解压 SDK
      run: |
        mkdir -p sdk
        tar -axf sdk.tar.zst -C sdk --strip-components=1
        echo "✅ SDK 解压完成"

    # ── 6. 初始化 Feeds ──────────────────────────────────────
    - name: 初始化 Feeds
      working-directory: sdk
      run: |
        ./scripts/feeds update -a >/dev/null 2>&1
        ./scripts/feeds install -a >/dev/null 2>&1
        echo "✅ Feeds 初始化完成"

    # ── 7. 完整保留目录结构平铺放入 SDK ──────────────────────
    - name: 部署源码并保留原始目录拓扑
      working-directory: sdk
      run: |
        REPO_DIR="/tmp/${REPO_NAME}"
        rm -rf "$REPO_DIR"
        git clone --depth 1 --branch "${{ inputs.repo_branch }}" "${{ inputs.repo_url }}" "$REPO_DIR"

        SRC_ROOT="$REPO_DIR"
        if [ -n "$PLUGIN_SUBDIR" ]; then
          SRC_ROOT="$REPO_DIR/$PLUGIN_SUBDIR"
          if [ ! -d "$SRC_ROOT" ]; then
            echo "❌ 指定子目录不存在: $PLUGIN_SUBDIR"
            exit 1
          fi
        fi

        # 统一平铺到 package/custom/ 下，保留完整的同级依赖（如 ../go-qnatter），同时避免污染原生 package/
        mkdir -p package/custom
        cp -rT "$SRC_ROOT" "package/custom"
        echo "📂 已将源码完整平铺部署至: package/custom/"

        # 修复 www -> htdocs 结构与 luci.mk 相对路径
        find package/custom -type d -name "www" 2>/dev/null | while read -r w; do
          pdir=$(dirname "$w")
          mkdir -p "$pdir/htdocs"
          cp -rT "$w" "$pdir/htdocs"
          rm -rf "$w"
        done
        find package/custom -name "Makefile" -exec sed -i 's#\.\./\.\./luci\.mk#$(TOPDIR)/feeds/luci/luci.mk#g' {} + 2>/dev/null || true

        # 识别需要编译的包和目录
        declare -a DETECTED_PKGS=()
        declare -a DETECTED_DIRS=()

        while read -r mk; do
          # 只认真正的 OpenWrt 包 Makefile（含 rules.mk / luci.mk include 或 define Package/），
          # 跳过 src/、po/ 等内部构建脚本，避免误生成 package/custom/xxx/src/compile 这类无效目标
          grep -qE '^[[:space:]]*include[[:space:]]+.*(rules\.mk|luci\.mk)|^[[:space:]]*define[[:space:]]+Package/' "$mk" || continue

          DIR_PATH=$(dirname "$mk")
          # 提取相对于 package/ 的路径
          REL_DIR="${DIR_PATH#package/}"
          DETECTED_DIRS+=("$REL_DIR")

          # 从 Makefile 提取所有 define Package/xxx
          DEFS=$(grep -oE '^[[:space:]]*define[[:space:]]+Package/[^ /:]+' "$mk" | awk '{print $2}' | sed 's#Package/##' || true)
          FOUND=0
          for p in $DEFS; do
            if [[ "$p" != *'$('* ]] && [ -n "$p" ]; then
              DETECTED_PKGS+=("$p")
              FOUND=1
            fi
          done
          
          if [ $FOUND -eq 0 ]; then
            PK_VAL=$(grep -E '^[[:space:]]*PKG_NAME[[:space:]]*[:?+]?=' "$mk" | head -n1 | sed -E 's/.*=[[:space:]]*//' | tr -d '\r ' || true)
            if [ -n "$PK_VAL" ] && [[ "$PK_VAL" != *'$('* ]]; then
              DETECTED_PKGS+=("$PK_VAL")
            else
              DETECTED_PKGS+=("$(basename "$DIR_PATH")")
            fi
          fi
        done < <(find package/custom -name "Makefile" -not -path "*/.git/*")

        # 若手动指定了包名则以手动为主
        INPUT_NAME="${{ inputs.package_name }}"
        if [ -n "$INPUT_NAME" ]; then
          DETECTED_PKGS=($(echo "$INPUT_NAME" | tr ',' ' '))
        fi

        FINAL_PKGS=($(echo "${DETECTED_PKGS[@]}" | tr ' ' '\n' | sort -u | tr '\n' ' '))
        FINAL_DIRS=($(echo "${DETECTED_DIRS[@]}" | tr ' ' '\n' | sort -u | tr '\n' ' '))

        echo "=========================================="
        echo "📁 待编译的相对目录: ${FINAL_DIRS[*]}"
        echo "📦 识别到的待编译包: ${FINAL_PKGS[*]}"
        echo "=========================================="

        echo "BUILD_PACKAGES=${FINAL_PKGS[*]}" >> $GITHUB_ENV
        echo "BUILD_DIRS=${FINAL_DIRS[*]}" >> $GITHUB_ENV
        echo "REPO_DIR=$REPO_DIR" >> $GITHUB_ENV

    # ── 8. 配置编译选项（启用 i18n 与多包） ────────────────────
    - name: 配置编译选项
      working-directory: sdk
      run: |
        # 自动将所有有效包的定义激活
        for dir in $BUILD_DIRS; do
          MF="package/${dir}/Makefile"
          # 提取 Makefile 中所有的 Package 定义
          grep -oE '^[[:space:]]*define[[:space:]]+Package/[^ /:]+' "$MF" | awk '{print $2}' | sed 's#Package/##' | while read -r pkg; do
            [[ "$pkg" != *'$('* ]] && [ -n "$pkg" ] && echo "CONFIG_PACKAGE_${pkg}=m" >> .config
          done
        done

        # make defconfig 会做一次全量 kconfig 求值。上游 feeds / SDK 元数据的循环依赖
        # （ariang-nginx 自依赖、fwupd-libs↔FWUPD_CURL、busybox-selinux↔base-files）会在这里
        # 报 error，kconfig 不中断、不影响构建；完整输出落盘 defconfig.log，失败时全量回放。
        make defconfig 2>&1 | tee defconfig.log
        RC=${PIPESTATUS[0]}
        if [ "$RC" -ne 0 ]; then
          echo "❌ make defconfig 失败（rc=$RC），完整输出:"
          cat defconfig.log
          exit 1
        fi

        # 说明：此处不再跑 make prereq——基础主机预检（.prereq-build）已由 defconfig 的
        # 依赖链自动触发；逐包预检只覆盖被默认勾选的无关包（perl/U-Boot 等），
        # 插件本身不声明预检、编译目标也不依赖这些 stamp，对插件编译无影响。

        # 透明核对：打印 .config 的非默认勾选（谁被 defconfig 勾上了，一目了然）
        echo "=========================================="
        echo "📋 .config 非默认勾选一览（含被默认拉进来的无关包）:"
        [ -x ./scripts/diffconfig.sh ] && ./scripts/diffconfig.sh
        echo "=========================================="
        echo "✅ 配置完成"

    # ── 9. 执行编译 ──────────────────────────────────────────
    - name: 逐包编译
      working-directory: sdk
      run: |
        # 编译前：列出本次将编译的包与源码目录
        echo "=========================================="
        echo "📋 本次将编译的包:"
        for pkg in $BUILD_PACKAGES; do
          echo "   📦 $pkg"
        done
        echo "📁 对应源码目录:"
        for dir in $BUILD_DIRS; do
          echo "   📂 package/${dir}"
        done
        echo "=========================================="

        # ── 关键 ───────────────────────────────────────────────
        # OPENWRT_BUILD=1 直接进入 root Makefile 的构建系统分支（跳过 include/toplevel.mk
        # 的 %:: 包装层）：否则每个 make 目标都会先重跑一遍 make prereq（全量预检）
        # + conf --defconfig（全量 kconfig 求值）+ prepare-tmpinfo（元数据扫描）。
        # 逐包编译、失败记录后跳过继续；包间依赖顺序由 tmp/.packagedeps 自动解析。
        SUCCESS=()
        FAILED=()

        for dir in $BUILD_DIRS; do
          echo ""
          echo "══════════════════════════════════"
          echo "🔨 编译: package/${dir}"
          echo "══════════════════════════════════"
          LOG="build-$(echo "$dir" | tr '/' '_').log"

          make OPENWRT_BUILD=1 "package/${dir}/compile" -j$(nproc) 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}

          if [ "$RC" -ne 0 ]; then
            echo "⚠️ 并行编译未通过（rc=$RC），改用单线程详细模式重试（完整输出）..."
            make OPENWRT_BUILD=1 "package/${dir}/compile" V=s -j1 2>&1 | tee "${LOG%.log}-retry.log"
            RC=${PIPESTATUS[0]}
          fi

          if [ "$RC" -ne 0 ]; then
            echo "❌ package/${dir} 编译失败，跳过并继续编译其余插件"
            echo "   错误关键字摘录:"
            grep -nE 'error|Error|fatal|undefined reference|No rule to make target' "${LOG%.log}"*.log 2>/dev/null | tail -n 15 || true
            FAILED+=("$dir")
          else
            echo "✅ package/${dir} 编译成功"
            SUCCESS+=("$dir")
          fi
        done

        echo ""
        echo "=========================================="
        echo "📊 编译结果:"
        echo "  ✅ 成功 ${#SUCCESS[@]}: ${SUCCESS[*]:-无}"
        echo "  ❌ 失败 ${#FAILED[@]}: ${FAILED[*]:-无}"
        echo "=========================================="

        # 编译完成后校验：每个识别到的包都应产出安装包；
        # 有编译失败时缺失属预期（只提示），全部目录成功才硬校验
        echo ""
        echo "🔍 校验各包产物..."
        MISS=0
        for pkg in $BUILD_PACKAGES; do
          HIT=$(find bin -type f \( -name "${pkg}_*" -o -name "${pkg}-*" \) -print -quit 2>/dev/null)
          if [ -n "$HIT" ]; then
            echo "   ✅ $pkg"
          else
            echo "   ⚠️ $pkg 未产出安装包"
            MISS=1
          fi
        done

        if [ "$MISS" -ne 0 ] && [ ${#FAILED[@]} -eq 0 ]; then
          echo "❌ 全部目录编译成功但有包未产出安装包，bin/ 目录现有安装包:"
          find bin -type f \( -name "*.ipk" -o -name "*.apk" \) 2>/dev/null
          exit 1
        fi

        # 全部失败才算整体失败（部分成功时保持 job 成功，产物照常收集/上传）
        if [ ${#SUCCESS[@]} -eq 0 ]; then
          echo "❌ 所有插件编译失败"
          exit 1
        fi

        echo "✅ 编译完成：成功 ${#SUCCESS[@]}，失败 ${#FAILED[@]}"

    # ── 10. 收集产物 ─────────────────────────────────────────
    - name: 收集编译产物
      run: |
        mkdir -p artifacts

        # 查找所有 ipk / apk 产物，匹配所有包名以及所有 i18n 语言包
        find sdk/bin -type f \( -name "*.ipk" -o -name "*.apk" \) | while read -r file; do
          FNAME=$(basename "$file")
          MATCHED=0

          for pkg in $BUILD_PACKAGES; do
            APP_NAME="${pkg#luci-app-}"
            # 匹配原包、或对应 app 的 i18n 包
            if [[ "$FNAME" == *"$pkg"* ]] || [[ "$FNAME" == *"luci-i18n-${APP_NAME}"* ]]; then
              MATCHED=1
              break
            fi
          done

          if [ $MATCHED -eq 1 ]; then
            echo "📦 找到产物: $FNAME"
            cp "$file" artifacts/
          fi
        done

        if [ ! "$(ls -A artifacts/ 2>/dev/null)" ]; then
          echo "❌ 未匹配到打包文件，以下是 bin/ 目录下的所有生成文件:"
          find sdk/bin -type f \( -name "*.apk" -o -name "*.ipk" \)
          exit 1
        fi

        echo ""
        echo "📦 收集到的所有交付物:"
        ls -lh artifacts/

    # ── 11. 上传构建结果 ─────────────────────────────────────
    - name: 上传产物
      uses: actions/upload-artifact@v6
      with:
        name: ${{ env.REPO_NAME }}-${{ env.VERSION }}-${{ env.TARGET }}-${{ env.SUBTARGET }}
        path: artifacts/*
        if-no-files-found: error
        retention-days: 90

    - name: 清理
      if: always()
      run: rm -rf sdk /tmp/plugin-repo artifacts
